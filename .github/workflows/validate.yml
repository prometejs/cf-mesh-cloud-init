name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck -x scripts/*.sh

      - name: yamllint
        run: yamllint .

      - name: Render user-data from CI fixture
        run: |
          set -a
          . tests/fixtures/ci.env
          set +a
          export TEMPLATE="$GITHUB_WORKSPACE/cloud-init/user-data.tpl"
          ./scripts/render-template.sh > /tmp/rendered.cfg

      - name: cloud-init schema
        run: cloud-init schema --config-file /tmp/rendered.cfg
