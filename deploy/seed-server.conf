# /etc/apache2/sites-available/seed-server.conf
# LAN-only seed server fronting localhost:8080 (the Python daemon).
# Plain HTTP for now — flip to TLS once you have a cert.

<VirtualHost *:80>
    ServerName seed-server.local

    # Reverse proxy → Python http.server on localhost
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /seed/  http://127.0.0.1:8080/seed/
    ProxyPassReverse /seed/  http://127.0.0.1:8080/seed/

    # Only /seed/ is allowed — and only from RFC1918 clients.
    # Adjust the CIDR list to match your actual PXE / management subnets.
    <Location /seed/>
        Require ip 127.0.0.1
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
    </Location>

    # Anything outside /seed/ → 403
    <LocationMatch "^(?!/seed/)">
        Require all denied
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/seed-error.log
    CustomLog ${APACHE_LOG_DIR}/seed-access.log combined
</VirtualHost>

# When you're ready for TLS, add a *:443 vhost mirroring the above with
# SSLEngine On + cert paths, and (optionally) a *:80 redirect to :443.
